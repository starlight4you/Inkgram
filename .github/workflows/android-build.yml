name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  TZ: UTC

permissions:
  contents: write

concurrency:
  group: inkgram-nightly-release
  cancel-in-progress: false

jobs:
  latest-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Fetch Git LFS objects
        run: |
          git lfs install --local
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4
          git submodule foreach --recursive 'git lfs install --local || true'
          git submodule foreach --recursive 'git lfs fetch --all || true'
          git submodule foreach --recursive 'git lfs checkout || true'
          tmpdir="${RUNNER_TEMP}/native-deps"
          rm -rf "$tmpdir" app/jni/tgvoip/third_party/libsrtp app/jni/tgvoip/third_party/rnnoise
          mkdir -p "$tmpdir"
          curl -fsSL https://github.com/cisco/libsrtp/archive/860492290f7d1f25e2bd45da6471bfd4cd4d7add.tar.gz \
            -o "$tmpdir/libsrtp.tar.gz"
          curl -fsSL https://github.com/xiph/rnnoise/archive/refs/heads/master.tar.gz \
            -o "$tmpdir/rnnoise.tar.gz"
          tar -xzf "$tmpdir/libsrtp.tar.gz" -C "$tmpdir"
          tar -xzf "$tmpdir/rnnoise.tar.gz" -C "$tmpdir"
          mv "$tmpdir/libsrtp-860492290f7d1f25e2bd45da6471bfd4cd4d7add" app/jni/tgvoip/third_party/libsrtp
          mv "$tmpdir/rnnoise-master" app/jni/tgvoip/third_party/rnnoise
          rm -rf app/jni/third_party/libyuv
          mkdir -p "$tmpdir/libyuv"
          curl -fsSL https://chromium.googlesource.com/libyuv/libyuv/+archive/refs/heads/main.tar.gz \
            | tar -xz -C "$tmpdir/libyuv"
          mv "$tmpdir/libyuv" app/jni/third_party/libyuv
          cat > vkryl/td/src/generated/kotlin/tgx/td/TdCiCompat.kt <<'EOF'
          @file:JvmName("Td")
          @file:JvmMultifileClass
          package tgx.td
          import org.drinkless.tdlib.TdApi.*
          fun assertMessageContent_cc875c63(): MessageContent? = null
          fun assertInputMessageContent_7c412303(): InputMessageContent? = null
          fun assertUpdate_2a2bec96(): Update? = null
          EOF
          sed -i '1i #include <jni.h>' app/jni/tgvoip/third_party/webrtc/sdk/android/src/jni/jni_helpers.h
          find app/jni/tgvoip/third_party/webrtc/generated -name '*.h' -exec sed -i '1i #include <jni.h>' {} +
          find app/jni/tgvoip/third_party/webrtc/generated -name '*.h' -exec sed -i 's/JNI_BOUNDARY_EXPORT/extern "C" __attribute__((visibility("default")))/g' {} +
          ! rg -n 'JNI_BOUNDARY_EXPORT' app/jni/tgvoip/third_party/webrtc/generated
          git -C tdlib lfs fetch --all
          git -C tdlib lfs checkout

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            'platforms;android-37.2' \
            'build-tools;37.0.0' \
            'ndk;30.0.16248370' \
            'cmake;3.22.1'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Configure unsigned build
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          rust.dir=${HOME}/.rustup
          org.gradle.workers.max=2
          app.disable_signing=true
          app.id=com.inkgram.app
          app.name=Inkgram
          app.download_url=https://github.com/starlight4you/Inkgram/releases
          app.sources_url=https://github.com/starlight4you/Inkgram
          telegram.api_id=94575
          telegram.api_hash=a3406de8d171bb422bb6ddf3bbd800e2
          tgx.extension=none
          EOF

      - name: Build arm64 debug APK
        run: |
          # Included annotation build otherwise only searches the plugin portal,
          # whose Kotlin POM can reference a BOM available on Maven Central.
          cat > "${RUNNER_TEMP}/inkgram-repositories.gradle" <<'EOF'
          settingsEvaluated { settings ->
            settings.pluginManagement.repositories {
              mavenCentral()
              gradlePluginPortal()
            }
          }
          EOF
          ./gradlew -I "${RUNNER_TEMP}/inkgram-repositories.gradle" :vkryl:td:generateTdlibFunctions --no-daemon
          cat > vkryl/td/src/generated/kotlin/tgx/td/TdCiCompat.kt <<'EOF'
          @file:JvmName("Td")
          @file:JvmMultifileClass
          package tgx.td
          import org.drinkless.tdlib.TdApi.*
          fun assertMessageContent_cc875c63(): MessageContent? = null
          fun assertInputMessageContent_7c412303(): InputMessageContent? = null
          fun assertUpdate_2a2bec96(): Update? = null
          EOF
          ./gradlew -I "${RUNNER_TEMP}/inkgram-repositories.gradle" :app:assembleLatestDebug -Pabi=arm64 --no-daemon --stacktrace -x validateGitSetup

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inkgram-latest-debug-arm64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish-nightly:
    if: github.ref == 'refs/heads/main'
    name: Publish nightly release
    needs: latest-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: inkgram-latest-debug-arm64
          path: nightly

      - name: Prepare stable nightly filename
        run: |
          apk="$(find nightly -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" nightly/Inkgram-nightly-arm64-v8a.apk

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          nightly_date="$(date -u +%Y%m%d)"
          version_name="$(sed -n 's/^version.name=//p' version.properties)"
          nightly_tag="v${version_name}-nightly.${nightly_date}.${short_sha}"
          nightly_title="v${version_name} Nightly ${nightly_date} (${short_sha})"
          notes="Automated Inkgram nightly build from commit ${GITHUB_SHA}.\n\nThis is a separate prerelease channel and is not part of the formal version releases."
          git tag "$nightly_tag" "$GITHUB_SHA"
          git push origin "$nightly_tag"
          gh release create "$nightly_tag" nightly/Inkgram-nightly-arm64-v8a.apk \
            --repo "$GITHUB_REPOSITORY" --title "$nightly_title" \
            --notes "$notes" --prerelease --latest=false --target "$GITHUB_SHA"
