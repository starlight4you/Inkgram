name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  latest-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platforms;android-37.2' \
            'build-tools;37.0.0' \
            'ndk;30.0.16248370' \
            'ndk;23.2.8568313' \
            'cmake;3.22.1'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Configure unsigned build
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          rust.dir=${HOME}/.rustup
          org.gradle.workers.max=2
          app.disable_signing=true
          app.id=com.inkgram.app
          app.name=Inkgram
          app.download_url=https://github.com/starlight4you/Inkgram/releases
          app.sources_url=https://github.com/starlight4you/Inkgram
          telegram.api_id=94575
          telegram.api_hash=a3406de8d171bb422bb6ddf3bbd800e2
          tgx.extension=none
          EOF

      - name: Build arm64 debug APK
        run: ./gradlew :app:assembleLatestDebug -Pabi=arm64 --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inkgram-latest-debug-arm64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
