name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  latest-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          fetch-tags: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Fetch Git LFS objects
        run: |
          git lfs install --local
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4
          git submodule foreach --recursive 'git lfs install --local || true'
          git submodule foreach --recursive 'git lfs fetch --all || true'
          git submodule foreach --recursive 'git lfs checkout || true'
          curl -fsSL https://raw.githubusercontent.com/cisco/libsrtp/860492290f7d1f25e2bd45da6471bfd4cd4d7add/crypto/math/stat.c \
            -o app/jni/tgvoip/third_party/libsrtp/crypto/math/stat.c
          curl -fsSL https://raw.githubusercontent.com/xiph/rnnoise/master/src/rnn_data.c \
            -o app/jni/tgvoip/third_party/rnnoise/src/rnn_data.c
          git -C tdlib lfs fetch --all
          git -C tdlib lfs checkout

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            'platforms;android-37.2' \
            'build-tools;37.0.0' \
            'ndk;30.0.16248370' \
            'ndk;23.2.8568313' \
            'cmake;3.22.1'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Configure unsigned build
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          rust.dir=${HOME}/.rustup
          org.gradle.workers.max=2
          app.disable_signing=true
          app.id=com.inkgram.app
          app.name=Inkgram
          app.download_url=https://github.com/starlight4you/Inkgram/releases
          app.sources_url=https://github.com/starlight4you/Inkgram
          telegram.api_id=94575
          telegram.api_hash=a3406de8d171bb422bb6ddf3bbd800e2
          tgx.extension=none
          EOF

      - name: Build arm64 debug APK
        run: ./gradlew :app:assembleLatestDebug -Pabi=arm64 --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inkgram-latest-debug-arm64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
